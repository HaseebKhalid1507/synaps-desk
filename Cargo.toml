[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.0.1"
edition = "2024"
rust-version = "1.98"
publish = false

[workspace.dependencies]
synaps-client = { path = "crates/synaps-client" }
# Longbridge's GPUI Kit pins Zed's GPUI snapshot (`gpui-pre =0.3.12`) exactly.
gpui-kit = { version = "=0.9.1", features = ["syntect", "profiler"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
tokio = { version = "1", default-features = false, features = ["rt", "net", "io-util", "time", "sync", "macros"] }
async-channel = "2"
anyhow = "1"
# Agent cards (synaps-cards docs/design.md v1.2, §9.1): the doc, the digest,
# the answer message and the fold, the same code the `cards` extension runs;
# and blocks (docs/blocks.md v1.3: the ops, the kinds, the board's fold, B1
# and B2), from bb7b698 on; the board's `Visibility::records()` (soft
# dismissals, D6b) from fb72358 (#12). Pinned to a revision: a new catalog
# version is a new pin.
cards-spec = { git = "https://github.com/HaseebKhalid1507/synaps-cards", rev = "5e1f872d6875a08563eb4b55c525e09c5f1420b2" }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
debug = false

[profile.dev]
debug = "limited"
