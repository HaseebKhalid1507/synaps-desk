name: CI
on:
  push:
    branches: [main, "spike/**"]
    tags: ["*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  build:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain (rust-toolchain.toml)
        shell: bash
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: Linux system packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libfontconfig-dev libwayland-dev libxkbcommon-x11-dev libx11-xcb-dev \
            libxcb1-dev libvulkan1 libzstd-dev libssl-dev libasound2-dev
      # The house rules (`clippy.toml`'s disallowed methods, denied in the
      # desktop's `[lints]`) and every other lint, as errors.
      - name: Clippy (workspace, all targets, -D warnings)
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      # The client on its own, as a crate that uses it alone builds it:
      # serde_json without `preserve_order` (its maps sort their keys).
      - name: Test synaps-client on its own (fixtures, named-pipe derivation on Windows)
        run: cargo test -p synaps-client --locked
      # The workspace as it ships (#28): one build of every crate, so
      # serde_json's features are unified as in the release build below.
      # gpui's http client turns on `preserve_order` (maps keep insertion
      # order), so the client's fixtures run here in the desktop's build,
      # where `-p synaps-client` alone never ran them. With the desktop's
      # logic tests and its UI tests (GPUI's headless test window: no
      # display, no GPU, no daemon). The counts are printed so the log
      # shows they ran.
      - name: Test the workspace as shipped (client + desktop, logic + headless UI tests)
        shell: bash
        run: |
          set -o pipefail
          cargo test --workspace --locked 2>&1 | tee workspace-tests.log
          passed=$(grep -E '^test result: ok' workspace-tests.log | awk '{s += $4} END {print s + 0}')
          ui=$(grep -cE '^test ui_tests::.* \.\.\. ok' workspace-tests.log || true)
          fixtures=$(grep -cE '^test catalog_page_requests_encode_as_the_daemon_expects \.\.\. ok' workspace-tests.log || true)
          echo "workspace: $passed tests passed, $ui of them UI tests; the client's fixtures ran: $fixtures"
          test "$passed" -gt 0 && test "$ui" -gt 0 && test "$fixtures" -eq 1
      # The same suites with every test's view split panes on (one pane;
      # the split tests add two), as a launch with no settings file has
      # been since split panes are on by default (Shady #59 M1). Linux: the
      # layout is the same on every platform.
      - name: Test synaps-desktop, split panes on (the split-on-tests lane)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -o pipefail
          cargo test -p synaps-desktop --locked --features split-on-tests 2>&1 | tee desktop-tests-split-on.log
          passed=$(grep -E '^test result: ok' desktop-tests-split-on.log | awk '{s += $4} END {print s + 0}')
          ui=$(grep -cE '^test ui_tests::.* \.\.\. ok' desktop-tests-split-on.log || true)
          grep -qE '^test split_tests::the_split_on_lane_builds_every_view_split_on \.\.\. ok' desktop-tests-split-on.log
          echo "synaps-desktop, split on: $passed tests passed, $ui of them UI tests"
          test "$passed" -gt 0 && test "$ui" -gt 0
      - name: Build release
        run: cargo build --release --locked -p synaps-desktop -p synaps-client
      - name: Binary size
        shell: bash
        run: ls -l target/release/synaps-desktop* target/release/synaps-probe*
      - uses: actions/upload-artifact@v4
        with:
          name: synaps-desktop-${{ runner.os }}
          path: |
            target/release/synaps-desktop
            target/release/synaps-desktop.exe
            target/release/synaps-probe
            target/release/synaps-probe.exe
          if-no-files-found: error

  # macOS minutes bill at 10x on a private repo: manual runs and tags only.
  macos:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain (rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p synaps-client --locked
      - run: cargo build --release --locked -p synaps-desktop -p synaps-client
      - run: ls -l target/release/synaps-desktop target/release/synaps-probe
      - uses: actions/upload-artifact@v4
        with:
          name: synaps-desktop-macOS
          path: |
            target/release/synaps-desktop
            target/release/synaps-probe
