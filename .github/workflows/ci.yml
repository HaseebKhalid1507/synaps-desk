name: CI
on:
  push:
    branches: [main, "spike/**"]
    tags: ["*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

# Every lane runs in parallel: lint, the release build and the three test
# lanes (each built once, its tests in slices on runners of their own).
# The `ci` job at the end checks the test lanes across their slices and is
# the one result to wait on.
jobs:
  lint:
    name: clippy + client alone (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain (rust-toolchain.toml)
        shell: bash
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: lint
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Linux system packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libfontconfig-dev libwayland-dev libxkbcommon-x11-dev libx11-xcb-dev \
            libxcb1-dev libvulkan1 libzstd-dev libssl-dev libasound2-dev
      # The house rules (`clippy.toml`'s disallowed methods, denied in the
      # desktop's `[lints]`) and every other lint, as errors.
      - name: Clippy (workspace, all targets, -D warnings)
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      # The client on its own, as a crate that uses it alone builds it:
      # serde_json without `preserve_order` (its maps sort their keys).
      - name: Test synaps-client on its own (fixtures, named-pipe derivation on Windows)
        run: cargo test -p synaps-client --locked

  # The workspace as it ships, on both platforms (the client's fixtures in
  # the desktop's build, #28), and the split-on-tests lane, Linux only: the
  # layout is the same on every platform. See tests.yml.
  tests-linux:
    name: tests (workspace, ubuntu)
    uses: ./.github/workflows/tests.yml
    with:
      os: ubuntu-latest
      lane: workspace
      slices: 6

  tests-windows:
    name: tests (workspace, windows)
    uses: ./.github/workflows/tests.yml
    with:
      os: windows-latest
      lane: workspace
      slices: 5

  tests-split-on:
    name: tests (split-on, ubuntu)
    uses: ./.github/workflows/tests.yml
    with:
      os: ubuntu-latest
      lane: split-on
      slices: 6

  release:
    name: release build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain (rust-toolchain.toml)
        shell: bash
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: release
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Linux system packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libfontconfig-dev libwayland-dev libxkbcommon-x11-dev libx11-xcb-dev \
            libxcb1-dev libvulkan1 libzstd-dev libssl-dev libasound2-dev
      - name: Build release
        run: cargo build --release --locked -p synaps-desktop -p synaps-client
      - name: Binary size
        shell: bash
        run: ls -l target/release/synaps-desktop* target/release/synaps-probe*
      - uses: actions/upload-artifact@v4
        with:
          name: synaps-desktop-${{ runner.os }}
          path: |
            target/release/synaps-desktop
            target/release/synaps-desktop.exe
            target/release/synaps-probe
            target/release/synaps-probe.exe
          if-no-files-found: error

  # The one result: every job passed (macOS too where it runs), and across
  # each lane's slices every test in its archive ran once and passed, UI
  # tests among them, the client's fixtures in the workspace build, the
  # split-on lane's own test in that lane (scripts/ci-tests.py; the counts
  # are in the job summary).
  #
  # It always runs, even on a cancelled run: a skipped job would count as
  # a passed check. Its last step passes only if every job it needs and
  # its own test report succeeded; anything else (failed, cancelled,
  # skipped, a step not run) fails it.
  ci:
    name: CI result
    if: always()
    needs: [lint, tests-linux, tests-windows, tests-split-on, release, macos]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: list-*
          path: artifacts
      - uses: actions/download-artifact@v4
        with:
          pattern: junit-*
          path: artifacts
      - name: The report's own tests
        run: python3 -W error scripts/ci-tests-test.py
      - name: Every test of every lane ran once and passed
        id: report
        run: python3 scripts/ci-tests.py artifacts Linux-workspace Windows-workspace Linux-split-on
      - name: Every job passed
        if: always()
        shell: python3 {0}
        env:
          NEEDS: ${{ toJSON(needs) }}
          REPORT: ${{ steps.report.outcome }}
          # macos' `if`, below: it runs on manual runs and tags only.
          MACOS_RUNS: ${{ github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/') }}
        run: |
          import json, os, sys
          results = {job: need["result"] for job, need in json.loads(os.environ["NEEDS"]).items()}
          results["the test report"] = os.environ["REPORT"] or "not run"
          ok = {job: {"success"} for job in results}
          if os.environ["MACOS_RUNS"] != "true":
              ok["macos"] = {"success", "skipped"}
          bad = [job for job, result in results.items() if result not in ok[job]]
          for job, result in results.items():
              print(f"{job}: {result}" + ("" if job not in bad else f", needs {' or '.join(sorted(ok[job]))}"))
          for job in bad:
              print(f"::error::{job}: {results[job]}")
          sys.exit(1 if bad else 0)

  # macOS minutes bill at 10x on a private repo: manual runs and tags only.
  # (The `ci` job's MACOS_RUNS is this condition.)
  macos:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain (rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p synaps-client --locked
      - run: cargo build --release --locked -p synaps-desktop -p synaps-client
      - run: ls -l target/release/synaps-desktop target/release/synaps-probe
      - uses: actions/upload-artifact@v4
        with:
          name: synaps-desktop-macOS
          path: |
            target/release/synaps-desktop
            target/release/synaps-probe
