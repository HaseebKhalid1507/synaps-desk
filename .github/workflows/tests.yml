# One test lane (called from ci.yml): its tests built once and archived
# (cargo nextest), then run in slices on parallel runners. The `ci` job in
# ci.yml checks across the slices that every test listed here ran once and
# passed (scripts/ci-tests.py).
name: Tests
on:
  workflow_call:
    inputs:
      os:
        type: string
        required: true
      lane:
        description: "workspace (cargo test --workspace) or split-on (-p synaps-desktop --features split-on-tests)"
        type: string
        required: true
      slices:
        type: number
        required: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  build:
    runs-on: ${{ inputs.os }}
    timeout-minutes: 45
    outputs:
      slices: ${{ steps.slices.outputs.slices }}
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain (rust-toolchain.toml)
        shell: bash
        run: rustup show active-toolchain || rustup toolchain install
      # One test cache per OS, the workspace lane's: the split-on lane
      # builds the same dependencies and only reads it. Saved on main
      # only; a pull request starts from main's.
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: tests
          save-if: ${{ github.ref == 'refs/heads/main' && inputs.lane == 'workspace' }}
      - name: Linux system packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libfontconfig-dev libwayland-dev libxkbcommon-x11-dev libx11-xcb-dev \
            libxcb1-dev libvulkan1 libzstd-dev libssl-dev libasound2-dev
      # Pinned to a commit (v2.90.8): its manifest holds the SHA-256 of
      # nextest 0.9.152's archives, checked before it is unpacked.
      - uses: taiki-e/install-action@fe3acb53a98b62c772db35de75ce0e4595e7ca8c
        with:
          tool: cargo-nextest@0.9.152
      # The workspace as it ships (#28): one build of every crate, so
      # serde_json's features are unified as in the release build. gpui's
      # http client turns on `preserve_order` (maps keep insertion order),
      # so the client's fixtures run in the desktop's build, where
      # `-p synaps-client` alone never ran them. With the desktop's logic
      # tests and its UI tests (GPUI's headless test window: no display,
      # no GPU, no daemon).
      #
      # split-on: the same suites with every test's view split panes on
      # (one pane; the split tests add two), as a launch with no settings
      # file has been since split panes are on by default (Shady #59 M1).
      - name: Build the tests (${{ inputs.lane }}) and list them
        shell: bash
        run: |
          case "${{ inputs.lane }}" in
            workspace) args=(--workspace --locked) ;;
            split-on) args=(-p synaps-desktop --locked --features split-on-tests) ;;
            *) echo "unknown lane ${{ inputs.lane }}"; exit 2 ;;
          esac
          mkdir run list
          cargo nextest archive "${args[@]}" --archive-file run/tests.tar.zst
          # The list the `ci` job checks the slices against: every test in
          # the archive the slices run, read from that archive, with no
          # filter and no partition.
          cargo nextest list --archive-file run/tests.tar.zst --workspace-remap . \
            --profile ci --ignore-default-filter --message-format json > list/tests.json
          echo "${{ inputs.slices }}" > list/slices
          # The slices run this nextest: no download of their own.
          cp "${CARGO_HOME:-$HOME/.cargo}"/bin/cargo-nextest* run/
          ls -l run
      # nextest runs no doc-tests: `cargo test --doc` runs them here, in
      # the same workspace build.
      - name: Doc-tests (workspace)
        if: inputs.lane == 'workspace'
        shell: bash
        run: |
          set -o pipefail
          cargo test --workspace --doc --locked 2>&1 | tee list/doctests.log
      - id: slices
        shell: bash
        run: echo "slices=[$(seq -s, 1 ${{ inputs.slices }})]" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: tests-${{ runner.os }}-${{ inputs.lane }}
          path: run/
          retention-days: 1
          compression-level: 0
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: list-${{ runner.os }}-${{ inputs.lane }}
          path: list/
          retention-days: 7
          if-no-files-found: error

  slice:
    name: slice ${{ matrix.slice }}
    needs: build
    runs-on: ${{ inputs.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        slice: ${{ fromJSON(needs.build.outputs.slices) }}
    steps:
      # The sources (`--workspace-remap .`): the tests' working directory,
      # their fixtures, and .config/nextest.toml's `ci` profile.
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: tests-${{ runner.os }}-${{ inputs.lane }}
          path: ${{ runner.temp }}/run
      - name: Tests, slice ${{ matrix.slice }} of ${{ inputs.slices }} (${{ inputs.lane }})
        shell: bash
        run: |
          # The runner's CPU: test times vary with it.
          echo "$(nproc) CPUs:$(grep -m1 'model name' /proc/cpuinfo | cut -d: -f2)" || true
          run="$RUNNER_TEMP/run"
          chmod +x "$run"/cargo-nextest*
          mkdir -p "$run/x"
          "$run"/cargo-nextest nextest run --archive-file "$run/tests.tar.zst" --workspace-remap . \
            --extract-to "$run/x" --profile ci --ignore-default-filter \
            --partition slice:${{ matrix.slice }}/${{ inputs.slices }}
      - name: JUnit
        if: always()
        shell: bash
        run: |
          f=$(find "$RUNNER_TEMP/run" target -path '*nextest/ci/junit.xml' 2>/dev/null | head -n 1)
          test -n "$f" && cp "$f" junit.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: junit-${{ runner.os }}-${{ inputs.lane }}-${{ matrix.slice }}
          path: junit.xml
          retention-days: 7
          if-no-files-found: error
