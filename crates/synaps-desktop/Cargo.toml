[package]
name = "synaps-desktop"
description = "Native desktop client for the Synaps daemon (GPUI spike)."
license = "MIT"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

# The house rules in `clippy.toml` are errors, not warnings.
[lints.clippy]
disallowed_methods = "deny"

[[bin]]
name = "synaps-desktop"
path = "src/main.rs"

[dependencies]
synaps-client.workspace = true
gpui-kit.workspace = true
serde.workspace = true
serde_json.workspace = true
async-channel.workspace = true
anyhow.workspace = true
log = "0.4"

[dev-dependencies]
# GPUI's headless test window (`TestAppContext`) for the UI tests
# (`src/ui_tests.rs`), tests only: the GPUI the Kit pins, its feature on.
gpui-pre = { version = "=0.3.12", features = ["test-support"] }
