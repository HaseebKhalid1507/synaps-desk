[package]
name = "synaps-desktop"
description = "Native desktop client for the Synaps daemon (GPUI spike)."
license = "MIT"
version.workspace = true
edition.workspace = true
# 1.100, the pinned toolchain (rust-toolchain.toml), for
# `ChildExt::main_thread_handle` (`model_list::tree` on Windows). The
# client keeps the workspace's 1.98.
rust-version = "1.100"
publish.workspace = true

# The house rules in `clippy.toml` are errors, not warnings.
[lints.clippy]
disallowed_methods = "deny"

[[bin]]
name = "synaps-desktop"
path = "src/main.rs"

[features]
# Tests only (Shady #59 M1): every test's view starts with split panes on,
# one pane, as a launch with no settings file does since they are on by
# default. `cargo test -p synaps-desktop --features split-on-tests` runs the
# unchanged suites so; without it they start off, as before.
split-on-tests = []

[dependencies]
synaps-client.workspace = true
gpui-kit.workspace = true
serde.workspace = true
serde_json.workspace = true
async-channel.workspace = true
anyhow.workspace = true
cards-spec.workspace = true
log = "0.4"
# Message times in local time (the system's zone): already in the tree
# through GPUI, with the same features.
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
# The key a card's remembered choice is kept by (`src/recall.rs`): already in
# the tree through cards-spec, the same version.
sha2 = "0.10"

# A picker read's command runs as a process tree of its own, killed whole
# (`model_list::tree`): a process group, a job object. Both already in the
# tree (synaps-client).
[target.'cfg(unix)'.dependencies]
libc = "0.2"

# The OS notifications of agent cards (D3, `src/notify.rs`): the XDG
# service on the session bus. Both are already in the lock (notify-rust's,
# under GPUI); the features are the ones that brings.
[target.'cfg(target_os = "linux")'.dependencies]
zbus = { version = "6.2", default-features = false, features = ["proxy", "default-rt"] }
futures-lite = "2.6"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading"] }

[dev-dependencies]
# GPUI's headless test window (`TestAppContext`) for the UI tests
# (`src/ui_tests.rs`), tests only: the GPUI the Kit pins, its feature on.
gpui-pre = { version = "=0.3.12", features = ["test-support"] }
