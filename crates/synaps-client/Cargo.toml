[package]
name = "synaps-client"
description = "Thin wire client for the Synaps daemon: discovery, connection, protocol mirrors. No GUI."
license = "MIT"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

# `clippy.toml` bans the unaddressed session commands (`Client::submit` ...)
# for the desktop, which must name the attachment (`Client::on`); the
# client's own API and tests keep them.
[lints.clippy]
disallowed_methods = "allow"

[features]
# Tests only: the disposer's controls (`blocks::dispose`: `Disposer::hold`,
# `Hold::step`, `Disposer::flush`, `Disposer::failed`, the probes) and
# `LiveLog::lock_probe`. Off in every build the app ships; this crate's
# tests (the dev-dependency below) and the desk's turn it on.
test-support = []

[dependencies]
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
async-channel.workspace = true
anyhow.workspace = true
cards-spec.workspace = true

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
sha2 = "0.10"
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_System_Pipes",
    "Win32_System_Threading",
] }

[dev-dependencies]
# Its own tests take its test controls (`test-support`).
synaps-client = { path = ".", features = ["test-support"] }
